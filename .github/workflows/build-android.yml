name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Capacitor & Build APK
        run: |
          npm install @capacitor/cli @capacitor/android
          
          # Initialize Capacitor if needed
          npx cap init --web-dir dist --name "QRAttend Pro" --id "com.qrattend.pro" || true
          
          # Add Android platform
          npx cap add android || true
          
          # Sync files
          npx cap sync android
          
          # Build APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-attendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30